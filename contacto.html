<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Swag Vynil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/contacto.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <nav class="main-nav">
                <a class="brand-logo" href="index.html">Swag Vynil</a>
                
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="blog.html">Blogs</a></li>
                    <li><a href="contacto.html" class="active">Contacto</a></li>
                </ul>

                <a href="carrito.html" class="cart-btn">🛒 Cart (<span id="cart-count">0</span>)</a>
            </nav>

            <div class="auth-bar">
                <a href="login.html">Iniciar sesión</a> | <a href="registro.html">Registrar usuario</a>
            </div>
        </div>
    </header>


    <main class="container py-5">
        <div class="text-center mb-4">
            <div class="logo-placeholder mb-2">
                <img src="images/logo-placeholder.png" alt="Logo Empresa" style="max-width: 120px;">
            </div>
            <h2 class="company-name">Swag Vynil</h2>
        </div>

        <section class="contact-form-wrapper mx-auto">
            <div class="card p-4 shadow-sm">
                <h3 class="text-center mb-4 text-uppercase fw-bold fs-5">Formulario de Contactos</h3>
                
                <form id="contact-form" novalidate>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                        <div class="invalid-feedback" id="error-nombre"></div>
                    </div>

                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correo" name="correo" placeholder="ejemplo@gmail.com, @duoc.cl" required>
                        <div class="invalid-feedback" id="error-correo"></div>
                    </div>

                    <div class="mb-3">
                        <label for="comentario" class="form-label">Comentario</label>
                        <textarea class="form-control" id="comentario" name="comentario" rows="4" required></textarea>
                        <div class="invalid-feedback" id="error-comentario"></div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-dark px-4 py-2">ENVIAR MENSAJE</button>
                    </div>
                </form>
            </div>
        </section>
    </main>


    <footer class="site-footer">
        <div class="container footer-content">
            <div class="footer-left">
                <span class="footer-logo">Swag Vynil</span>
                <ul class="footer-categories">
                    <li><a href="#">Pop</a></li>
                    <li><a href="#">Rock</a></li>
                    <li><a href="#">Urbano</a></li>
                </ul>
            </div>

            <div class="footer-newsletter">
                <span>¡Mantente al tanto! Únete a nuestro newsletter</span>
                <form class="newsletter-form">
                    <input type="email" placeholder="Enter Email" required>
                    <button type="submit">Subscribe</button>
                </form>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/contacto.js"></script>
</body>

</html>
