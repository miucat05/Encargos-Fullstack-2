<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito de Compras - Swag Vynil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/carrito.css">
</head>

<body>
    <header class="site-header pt-4 pb-3">
        <div class="container">
            <nav class="main-nav">
                <a class="brand-logo" href="index.html">Swag Vynil</a>
                
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="blog.html">Blogs</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>

                <a href="carrito.html" class="cart-btn active">🛒 Cart (<span id="cart-count">0</span>)</a>
            </nav>

            <div class="auth-bar">
                <a href="login.html">Iniciar sesión</a> | <a href="registro.html">Registrar usuario</a>
            </div>
        </div>
    </header>

    <main class="container py-4">
        <h1 class="page-title mb-4">Mi carrito de compras</h1>

        <div class="row g-4">
            <section class="col-lg-8" id="cart-items-container">
            </section>


            <aside class="col-lg-4">
                <div class="cart-summary-panel border p-4 rounded bg-light">
                    <div class="summary-total d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-bold fs-5">TOTAL:</span>
                        <strong id="cart-total" class="fs-4 text-primary">$0</strong>
                    </div>

                    <form class="coupon-form mb-3" id="coupon-form">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" placeholder="Cupón de descuento" id="coupon-input">
                            <button class="btn btn-outline-secondary" type="button" id="btn-coupon">APLICAR</button>
                        </div>
                    </form>

                    <button class="btn btn-dark w-100 py-2 fw-bold" id="btn-pay">PAGAR</button>
                </div>
            </aside>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <div class="footer-left">
                <span class="footer-logo">Swag Vynil</span>
                <ul class="footer-categories">
                    <li><a href="#">Pop</a></li>
                    <li><a href="#">Rock</a></li>
                    <li><a href="#">Urbano</a></li>
                </ul>
            </div>

            <div class="footer-newsletter">
                <span>¡Mantente al tanto! Únete a nuestro newsletter</span>
                <form class="newsletter-form">
                    <input type="email" placeholder="Enter Email" required>
                    <button type="submit">Subscribe</button>
                </form>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
</body>

</html>
