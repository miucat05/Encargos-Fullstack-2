<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swag Vynil - Productos (Admin)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a class="brand-logo" href="admin-home.html">
            <img src="images/logoswag.png" alt="Logo Swag Vynil" class="logo-img">
            <span class="brand-logo-text">Swag Vynil <span style="color: #0d6efd;">Admin</span></span>
            </a>
            <nav>
                <ul>
                    <li><a href="admin-home.html">Dashboard</a></li>
                    <li><a href="admin-productos.html" class="active">Productos</a></li>
                    <li><a href="admin-usuarios.html">Usuarios</a></li>
                </ul>
            </nav>
            <a class="volver-tienda" href="/index.html">&larr; Volver a la tienda</a>
        </aside>
        <main class="admin-content">
            <header class="admin-topbar">
                <h1>Productos</h1>
                <a href="admin-producto-form.html" class="btn-nuevo">+ Nuevo producto </a>
            </header>

            <table class="admin-table" id="tabla-productos">
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </main>
    </div>

    <script src="/js/productos-data.js"></script>
    <script src="/js/admin-productos.js"></script>
</body>
</html>
