<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swag Vynil - Nuevo/Editar producto (Admin)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a class="brand-logo" href="admin-home.html">Swag Vynil <span>Admin</span></a>
            <nav>
                <ul>
                    <li><a href="admin-home.html">Dashboard</a></li>
                    <li><a href="admin-productos.html" class="active">Productos</a></li>
                    <li><a href="admin-usuarios.html">Usuarios</a></li>
                </ul>
            </nav>
            <a class="volver-tienda" href="../index.html">&larr; Volver a la tienda</a>
        </aside>

        <main class="admin-content">
            <header class="admin-topbar">
                <h1 id="titulo-form">Nuevo producto</h1>
            </header>

            <form id="form-producto" class="admin-form" novalidate>
                <div class="campo">
                    <label for="codigo">Código producto</label>
                    <input type="text" id="codigo" required minlength="3">
                    <small class="error" id="error-codigo"></small>
                </div>

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required maxlength="100">
                    <small class="error" id="error-nombre"></small>
                </div>

                <div class="campo">
                    <label for="descripcion">Descripción (opcional)</label>
                    <textarea id="descripcion" maxlength="500"></textarea>
                    <small class="error" id="error-descripcion"></small>
                </div>

                <div class="campo">
                    <label for="precio">Precio</label>
                    <input type="number" id="precio" required min="0" step="0.01">
                    <small class="error" id="error-precio"></small>
                </div>

                <div class="campo">
                    <label for="stock">Stock</label>
                    <input type="number" id="stock" required min="0" step="1">
                    <small class="error" id="error-stock"></small>
                </div>

                <div class="campo">
                    <label for="stockCritico">Stock crítico (opcional)</label>
                    <input type="number" id="stockCritico" min="0" step="1">
                    <small class="error" id="error-stockCritico"></small>
                </div>

                <div class="campo">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" required>
                        <option value="">-- Seleccione --</option>
                        <option value="Pop">Pop</option>
                        <option value="Urbano">Urbano</option>
                    </select>
                    <small class="error" id="error-categoria"></small>
                </div>

                <div class="campo">
                    <label for="imagen">Imagen (opcional)</label>
                    <input type="file" id="imagen" accept="image/*">
                </div>

                <button type="submit" class="btn-guardar">Guardar</button>
            </form>
        </main>
    </div>

    <script src="/js/productos-data.js"></script>
    <script src="/js/validaciones-admin.js"></script>
    <script src="/js/admin-productos.js"></script>
</body>
</html>
