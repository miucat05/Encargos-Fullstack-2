<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swag Vynil - Registro</title>
    <link rel="stylesheet" href="css/registro.css">
    <link rel="stylesheet" href="css/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
     <header class="site-header pt-4 pb-3">
        <div class="container">

            <nav class="main-nav">
                <a class="brand-logo" href="index.html">Swag Vynil</a>
                
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="blog.html">Blogs</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
    </header>

    <main>
        <form class="bg-white p-4 rounded shadow-sm mx-auto form-card" action="#" method="post" id="formulario-registro">
            <h2 class="mb-4">Crear cuenta</h2>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" name="nombre" id="nombre" autocomplete="name" required>
            </div>

            <div class="mb-3">
                <label for="correo-registro" class="form-label">Correo electronico</label>
                <input type="email" class="form-control" name="correo" id="correo-registro" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label for="contrasena-registro" class="form-label">Contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control" name="contrasena" id="contrasena-registro" autocomplete="new-password" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggle-contrasena-registro">
                        Ver
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label for="confirmar-contrasena" class="form-label">Confirmar contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control" name="confirmar_contrasena" id="confirmar-contrasena" autocomplete="new-password" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggle-confirmar">
                        Ver
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Registrarse</button>

            <p class="mt-3 mb-0">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </form>
    </main>
    <footer class="site-footer">
        <div class="container footer-content">
            <div class="footer-left">
                <span class="footer-logo">Swag Vynil</span>
                <ul class="footer-categories">
                    <li><a href="#">Pop</a></li>
                    <li><a href="#">Rock</a></li>
                    <li><a href="#">Urbano</a></li>
                </ul>
            </div>

            <div class="footer-newsletter">
                <span>¡Mantente al tanto! Únete a nuestro newsletter</span>
                <form class="newsletter-form">
                    <input type="email" placeholder="Enter Email" required>
                    <button type="submit">Subscribe</button>
                </form>
            </div>
        </div>
    </footer>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
<script src="js/registro.js"></script>

</html>
