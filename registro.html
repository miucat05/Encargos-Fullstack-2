<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swag Vynil - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/registro.css">
</head>

<body>
    <header class="site-header pt-4 pb-3">
        <div class="container">

            <nav class="main-nav">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="images/logoswag.png" alt="Logo Swag Vynil" class="logo-img">
                <span class="brand-logo-text-store">Swag Vynil</span>
                </a>

                <ul class="nav-links">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="blog.html">Blogs</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>

                <a href="carrito.html" class="cart-btn">🛒 Cart (<span id="cart-count">0</span>)</a>
            </nav>

            <div class="auth-bar">
                <a href="login.html">Iniciar sesión</a> | <a href="registro.html">Registrar usuario</a>
            </div>
        </div>
    </header>

    <main>
        <form class="bg-white p-4 rounded shadow-sm mx-auto form-card" action="#" method="post"
            id="formulario-registro">
            <h2 class="mb-4">Crear cuenta</h2>

            <div class="mb-3">
                <label for="run" class="form-label">RUN (sin puntos ni guión)</label>
                <input type="text" class="form-control" id="run" placeholder="19011022K" required>
                <div class="invalid-feedback" id="error-run"></div>
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" autocomplete="given-name" required>
                <div class="invalid-feedback" id="error-nombre"></div>
            </div>

            <div class="mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input type="text" class="form-control" id="apellidos" autocomplete="family-name" required>
                <div class="invalid-feedback" id="error-apellidos"></div>
            </div>

            <div class="mb-3">
                <label for="correo-registro" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo-registro" autocomplete="email" required>
                <div class="invalid-feedback" id="error-correo-registro"></div>
            </div>

            <div class="mb-3">
                <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control" id="fechaNacimiento">
            </div>

            <div class="mb-3">
                <label for="region" class="form-label">Región</label>
                <select class="form-select" id="region" required>
                    <option value="">-- Seleccione la región --</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="comuna" class="form-label">Comuna</label>
                <select class="form-select" id="comuna" required>
                    <option value="">-- Seleccione la comuna --</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="direccion" required>
                <div class="invalid-feedback" id="error-direccion"></div>
            </div>

            <div class="mb-3">
                <label for="contrasena-registro" class="form-label">Contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="contrasena-registro" autocomplete="new-password"
                        required>
                    <button class="btn btn-outline-secondary" type="button" id="toggle-contrasena-registro">
                        Ver
                    </button>
                </div>
                <div class="invalid-feedback" id="error-contrasena-registro"></div>
            </div>

            <div class="mb-3">
                <label for="confirmar-contrasena" class="form-label">Confirmar contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="confirmar-contrasena" autocomplete="new-password"
                        required>
                    <button class="btn btn-outline-secondary" type="button" id="toggle-confirmar">
                        Ver
                    </button>
                </div>
                <div class="invalid-feedback" id="error-confirmar-contrasena"></div>
            </div>

            <button type="submit" class="btn btn-primary">Registrarse</button>

            <p class="mt-3 mb-0">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </form>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <div class="footer-left">
                <span class="footer-logo">Swag Vynil</span>
                <ul class="footer-categories">
                    <li><a href="#">Pop</a></li>
                    <li><a href="#">Rock</a></li>
                    <li><a href="#">Urbano</a></li>
                </ul>
            </div>

            <div class="footer-newsletter">
                <span>¡Mantente al tanto! Únete a nuestro newsletter</span>
                <form class="newsletter-form">
                    <input type="email" placeholder="Enter Email" required>
                    <button type="submit">Subscribe</button>
                </form>
            </div>
        </div>
    </footer>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
<script src="js/usuarios-data.js"></script>
<script src="js/validaciones-admin.js"></script>
<script src="js/registro.js"></script>

</html>
